<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Simple & Elegant Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Smooth Transitions */
        * {
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <main class="w-full max-w-xl">
        <!-- Top Utility Bar: Theme Switcher -->
        <div class="flex justify-between items-center mb-6 px-2">
            <div class="flex items-center space-x-2 text-slate-500 dark:text-slate-400 text-xs font-semibold uppercase tracking-wider">
                <i class="fas fa-shield-alt text-primary-500"></i>
                <span>Secure Form</span>
            </div>
            
            <button id="themeToggleBtn" aria-label="Toggle Theme" class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium shadow-sm hover:border-primary-500 dark:hover:border-primary-500 focus:outline-none">
                <i class="fas fa-moon dark:hidden text-slate-500"></i>
                <i class="fas fa-sun hidden dark:block text-amber-400"></i>
                <span class="dark:hidden">Dark Mode</span>
                <span class="hidden dark:inline">Light Mode</span>
            </button>
        </div>

        <!-- Form Card Container -->
        <div class="bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/80 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-none p-6 sm:p-10 backdrop-blur-sm relative overflow-hidden">
            
            <!-- Accent Top Bar -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-primary-500 via-sky-400 to-indigo-500"></div>

            <!-- Form Header -->
            <div class="mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white tracking-tight">
                    Get in Touch
                </h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 leading-relaxed">
                    Fill out the form below and we'll get back to you as soon as possible.
                </p>
            </div>

            <form id="contactForm" onsubmit="handleFormSubmit(event)" class="space-y-5" novalidate>
                
                <!-- Full Name Field -->
                <div>
                    <label for="fullName" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">
                        Full Name <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-user text-sm"></i>
                        </div>
                        <input type="text" id="fullName" name="fullName" required placeholder="John Doe"
                            class="w-full pl-10 pr-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20">
                    </div>
                </div>

                <!-- Email Address Field -->
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">
                        Email Address <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-envelope text-sm"></i>
                        </div>
                        <input type="email" id="email" name="email" required placeholder="john@example.com"
                            class="w-full pl-10 pr-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20">
                    </div>
                </div>

                <!-- Inquiry Category Dropdown -->
                <div>
                    <label for="inquiryType" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">
                        Inquiry Type
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-list-ul text-sm"></i>
                        </div>
                        <select id="inquiryType" name="inquiryType"
                            class="w-full pl-10 pr-10 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50 text-slate-900 dark:text-white focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 appearance-none cursor-pointer">
                            <option value="general">General Inquiry</option>
                            <option value="support">Technical Support</option>
                            <option value="feedback">Product Feedback</option>
                            <option value="billing">Billing Question</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Subject Field -->
                <div>
                    <label for="subject" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">
                        Subject <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-heading text-sm"></i>
                        </div>
                        <input type="text" id="subject" name="subject" required placeholder="How can we help?"
                            class="w-full pl-10 pr-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20">
                    </div>
                </div>

                <!-- Comments/Message Field -->
                <div>
                    <label for="comments" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">
                        Comments or Details <span class="text-rose-500">*</span>
                    </label>
                    <textarea id="comments" name="comments" rows="4" required placeholder="Write your message here..."
                        class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" id="submitBtn"
                        class="w-full py-3.5 px-6 rounded-xl bg-primary-600 hover:bg-primary-700 active:bg-primary-800 text-white font-semibold text-sm shadow-md hover:shadow-lg hover:shadow-primary-500/25 flex items-center justify-center space-x-2 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800 transform active:scale-[0.99]">
                        <span id="btnText">Send Message</span>
                        <i id="btnIcon" class="fas fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </form>

            <!-- Success Alert Notification -->
            <div id="successState" class="hidden mt-6 p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 flex items-start space-x-3">
                <i class="fas fa-check-circle text-lg mt-0.5 flex-shrink-0"></i>
                <div class="text-xs sm:text-sm">
                    <p class="font-bold">Thank you for reaching out!</p>
                    <p class="mt-0.5 opacity-90">Your message has been successfully submitted. We will contact you shortly.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Theme Switcher Logic
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                htmlElement.classList.add('light');
            } else {
                htmlElement.classList.remove('light');
                htmlElement.classList.add('dark');
            }
        });

        // Form Submission Logic
        function handleFormSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const successState = document.getElementById('successState');
            const form = document.getElementById('contactForm');

            // Button Loading State Animation
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.innerText = 'Sending...';
            btnIcon.className = 'fas fa-circle-notch fa-spin text-xs';

            // Simulate API Request Network Delay
            setTimeout(() => {
                // Reset Button State
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.innerText = 'Send Message';
                btnIcon.className = 'fas fa-paper-plane text-xs';

                // Display Success Message & Reset Inputs
                successState.classList.remove('hidden');
                form.reset();

                // Auto-hide success banner after 5 seconds
                setTimeout(() => {
                    successState.classList.add('hidden');
                }, 5000);
            }, 1200);
        }
    </script>
</body>
</html>
